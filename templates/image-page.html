<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} | {{SITE_TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<meta name="author" content="{{AUTHOR}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="canonical" href="{{PAGE_URL}}">

<!-- Open Graph -->
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{META_DESCRIPTION}}">
<meta property="og:image" content="{{IMAGE_URL}}">
<meta property="og:url" content="{{PAGE_URL}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{SITE_TITLE}}">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{META_DESCRIPTION}}">
<meta name="twitter:image" content="{{IMAGE_URL}}">

<!-- JSON-LD structured data (generated by build.py, escaped for JSON) -->
<script type="application/ld+json">{{JSON_LD}}</script>

<style>
  :root { --cyan:#22D3EE; --blue:#2563FF; --violet:#A855F7; --magenta:#FF2ED1; --bg:#000000;
          --fg:#E9EFFF; --muted:#9DB0DE; --card:#0A0A0A; --line:rgba(34,211,238,.38); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--fg); font: 17px/1.6 Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
         background: #000; }
  header, footer { text-align: center; padding: 1rem; color: var(--muted); font-size: .9rem; }
  header a { color: var(--cyan); text-decoration: none; font: 700 1rem Orbitron, "Eurostile", system-ui, sans-serif;
             letter-spacing: .16em; text-transform: uppercase; }
  main { max-width: 960px; margin: 0 auto; padding: 1rem; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
           box-shadow: 0 0 34px rgba(37,99,255,.45), 0 0 70px rgba(168,85,247,.2); }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { padding: 1rem 1.25rem; }
  h1 { font: 700 clamp(1.3rem, 4vw, 2rem)/1.2 Orbitron, "Eurostile", system-ui, sans-serif; letter-spacing: .04em;
       text-transform: uppercase; margin: .5rem 0; color: #fff; filter: drop-shadow(0 0 12px rgba(37,99,255,.6)); }
  .meta { color: var(--muted); font-size: .9rem; margin: 0; }
  .shop { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem; margin: 1.2rem 0 .3rem; }
  .price { font: 700 1.25rem Orbitron, "Eurostile", system-ui, sans-serif; color: #fff; }
  .buy { display: inline-block; padding: .85rem 1.6rem; border-radius: 10px; border: 1px solid var(--cyan);
         background: linear-gradient(180deg,#3B79FF,#2563FF); color: #fff; font-weight: 700; text-decoration: none;
         letter-spacing: .03em; box-shadow: 0 0 18px rgba(37,99,255,.65), inset 0 0 12px rgba(34,211,238,.25); }
  .buy:hover { border-color: var(--magenta); box-shadow: 0 0 26px rgba(255,46,209,.55); }
  .back { display: inline-block; margin: 1rem 0; color: var(--cyan); font-weight: 600; }
  .back:hover { color: #fff; text-shadow: 0 0 10px var(--cyan); }
</style>
</head>
<body>
<header><a href="{{BASE_URL}}/">{{SITE_TITLE}}</a></header>
<main>
  <figure>
    <img src="{{IMAGE_URL}}" alt="{{ALT}}" loading="eager">
    <figcaption>
      <h1>{{TITLE}}</h1>
      <p class="meta">By {{AUTHOR}}</p>
      <p>{{DESCRIPTION}}</p>
      {{SHOP_BLOCK}}
    </figcaption>
  </figure>
  <a class="back" href="{{BASE_URL}}/">&larr; Back to the gallery</a>
</main>
<footer>&copy; {{AUTHOR}}. All rights reserved.</footer>
</body>
</html>
