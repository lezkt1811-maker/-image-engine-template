<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} | {{SITE_TITLE}}</title>
<meta name="description" content="{{SITE_DESCRIPTION}}">
<meta name="author" content="{{AUTHOR}}">
<link rel="canonical" href="{{PAGE_URL}}">

<!-- Open Graph -->
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{SITE_DESCRIPTION}}">
<meta property="og:image" content="{{IMAGE_URL}}">
<meta property="og:url" content="{{PAGE_URL}}">
<meta property="og:type" content="article">
<meta property="og:site_name" content="{{SITE_TITLE}}">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{SITE_DESCRIPTION}}">
<meta name="twitter:image" content="{{IMAGE_URL}}">

<!-- JSON-LD structured data (generated by build.py, escaped for JSON) -->
<script type="application/ld+json">{{JSON_LD}}</script>

<style>
  :root { --bg: #f7f5f2; --fg: #1d1d1f; --muted: #6e6e73; --card: #ffffff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header, footer { text-align: center; padding: 1rem; color: var(--muted); font-size: 0.9rem; }
  header a { color: var(--fg); text-decoration: none; font-weight: 600; }
  main { max-width: 960px; margin: 0 auto; padding: 1rem; }
  figure {
    margin: 0; background: var(--card); border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { padding: 1rem 1.25rem; }
  h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 0.5rem 0; }
  .meta { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .back { display: inline-block; margin: 1rem 0; color: var(--fg); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --fg: #f5f5f7; --muted: #9a9aa2; --card: #1c1c1f; }
  }
</style>
</head>
<body>
<header><a href="{{BASE_URL}}/">{{SITE_TITLE}}</a></header>
<main>
  <figure>
    <img src="{{IMAGE_URL}}" alt="{{TITLE}}" loading="eager">
    <figcaption>
      <h1>{{TITLE}}</h1>
      <p class="meta">By {{AUTHOR}}</p>
      <p>{{SITE_DESCRIPTION}}</p>
    </figcaption>
  </figure>
  <a class="back" href="{{BASE_URL}}/">&larr; Back to the gallery</a>
</main>
<footer>&copy; {{AUTHOR}}. All rights reserved.</footer>
</body>
</html>
